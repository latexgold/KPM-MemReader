name: Build KPM

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Toolchain & Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu wget unzip

    - name: Setup Compiler Path
      run: |
        sudo ln -sf /usr/bin/aarch64-linux-gnu-gcc /usr/local/bin/aarch64-none-elf-gcc
        sudo ln -sf /usr/bin/aarch64-linux-gnu-ld /usr/local/bin/aarch64-none-elf-ld
        sudo ln -sf /usr/bin/aarch64-linux-gnu-objcopy /usr/local/bin/aarch64-none-elf-objcopy

    - name: Download KernelPatch Framework (ZIP)
      run: |
        # Download the ZIP instead of git clone
        wget https://github.com/bmax121/KernelPatch/archive/refs/heads/main.zip -O kpatch.zip
        unzip kpatch.zip
        # The zip extracts to KernelPatch-main
        mkdir -p kernel/include
        mkdir -p kernel/patch/include
        cp -r KernelPatch-main/kernel/include/* kernel/include/
        cp -r KernelPatch-main/kernel/patch/include/* kernel/patch/include/

    - name: Compile KPM
      run: |
        export TARGET_COMPILE=aarch64-none-elf-
        make

    - name: Upload KPM Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kernel_Hack_kpm
        path: Kernel_Hack.kpm
