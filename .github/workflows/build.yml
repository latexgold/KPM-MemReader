name: Build KPM

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download Official ARM Toolchain
      run: |
        wget https://developer.arm.com/-/media/Files/downloads/gnu/12.2.rel1/binrel/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz
        tar -xf arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz
        echo "$PWD/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf/bin" >> $GITHUB_PATH

    - name: Download KernelPatch
      run: |
        git clone --depth 1 https://github.com/bmax121/KernelPatch.git kpatch

    - name: Compile KPM
      run: |
        export TARGET_COMPILE=aarch64-none-elf-
        export KP_DIR=$PWD/kpatch
        make

    - name: Upload KPM Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kernel_Hack_kpm
        path: Kernel_Hack.kpm
