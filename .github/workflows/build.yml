name: Build KPM

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential wget

    - name: Download Toolchain
      run: |
        wget https://developer.arm.com/-/media/Files/downloads/gnu-a/10.3-2021.07/binrel/gcc-arm-10.3-2021.07-x86_64-aarch64-none-elf.tar.xz
        tar -xf gcc-arm-10.3-2021.07-x86_64-aarch64-none-elf.tar.xz
        echo "$PWD/gcc-arm-10.3-2021.07-x86_64-aarch64-none-elf/bin" >> $GITHUB_PATH

    - name: Download KernelPatch Framework
      run: |
        git clone --depth 1 https://github.com/bmax121/KernelPatch.git kpatch
        # Create the expected directory structure
        mkdir -p kernel/include
        mkdir -p kernel/patch/include
        # Safely copy the headers over instead of using symbolic links
        cp -r kpatch/kernel/include/* kernel/include/
        cp -r kpatch/kernel/patch/include/* kernel/patch/include/

    - name: Compile KPM
      run: |
        # Match the variable expected by the Makefile
        export TARGET_COMPILE=aarch64-none-elf-
        make

    - name: Upload KPM Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kernel_Hack_kpm
        path: Kernel_Hack.kpm
